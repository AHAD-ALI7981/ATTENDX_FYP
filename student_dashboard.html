<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>

<body class="dashboard-mode">

    <div id="app-layout" class="dashboard-layout" style="padding-top: 0;">
        <!-- Sidebar -->
        <aside class="sidebar" style="border-top-left-radius: 0;">
            <div class="sidebar-header" style="margin-top: 10px;">
                <h2>Student Panel</h2>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-target="attendance-tab">
                    <i class="ri-bar-chart-box-line"></i> My Attendance
                </button>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn sidebar-logout"><i class="ri-logout-box-r-line"></i> Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="dashboard-header" style="margin-bottom: 30px;">
                <h2 id="welcome-msg">Welcome, STUDENT</h2>
                <button id="btn-open-update-password" class="secondary-btn" style="padding: 8px 18px; font-size: 0.9rem; display: flex; align-items: center; gap: 6px;">
                    <i class="ri-lock-password-line"></i> Update Password
                </button>
            </div>

            <!-- Update Password Modal -->
            <div id="update-password-modal" class="modal-overlay hidden">
                <div class="modal-content">
                    <div class="card" style="border-left: 5px solid var(--accent);">
                        <h4><i class="ri-lock-password-line"></i> Update Password</h4>
                        <p class="hint">Enter your current password and choose a new one.</p>
                        <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px;">
                            <input type="password" id="current-password-input" placeholder="Current Password" style="width: 100%; padding: 12px 16px; border: 1px solid var(--glass-border); border-radius: var(--radius-sm); font-family: var(--font); font-size: 0.95rem; color: var(--white); background: var(--input-bg); outline: none;">
                            <input type="password" id="new-password-input" placeholder="New Password" style="width: 100%; padding: 12px 16px; border: 1px solid var(--glass-border); border-radius: var(--radius-sm); font-family: var(--font); font-size: 0.95rem; color: var(--white); background: var(--input-bg); outline: none;">
                            <input type="password" id="confirm-password-input" placeholder="Confirm New Password" style="width: 100%; padding: 12px 16px; border: 1px solid var(--glass-border); border-radius: var(--radius-sm); font-family: var(--font); font-size: 0.95rem; color: var(--white); background: var(--input-bg); outline: none;">
                            <p id="update-password-error" style="color: var(--danger); font-size: 0.85rem; min-height: 20px;"></p>
                            <div style="display: flex; gap: 10px;">
                                <button id="btn-submit-update-password" class="action-btn" style="flex: 1;">Save</button>
                                <button id="btn-cancel-update-password" class="secondary-btn" style="flex: 1;">Cancel</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="dashboard-content" style="margin-top: 0;">

                <!-- Attendance Tab -->
                <div id="attendance-tab" class="tab-content active">
                    <div class="card">
                        <h4>Check Your Attendance</h4>
                        <p class="hint" style="margin-bottom: 15px;">Select an enrolled course to view your attendance record.</p>
                        <div class="input-group">
                            <select id="student-course-select">
                                <option value="" disabled selected>Select Course...</option>
                            </select>
                            <button class="action-btn" id="btn-check-attendance" style="max-width: 200px;">Check</button>
                        </div>
                    </div>

                    <div id="student-action-area" style="display: none;">
                        <div class="card" style="border-left: 5px solid #8e44ad;">
                            <div id="student-report-detail"></div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/student.js"></script>
</body>

</html>
