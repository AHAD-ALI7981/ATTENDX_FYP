<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>

<body class="dashboard-mode">


    <div id="app-layout" class="dashboard-layout" style="padding-top: 0;">
        <!-- Sidebar -->
        <aside class="sidebar" style="border-top-left-radius: 0;">
            <div class="sidebar-header" style="margin-top: 10px;">
                <h2>Teacher Panel</h2>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-target="my-courses-tab">
                    <i class="ri-book-2-line"></i> My Courses
                </button>
                <button class="nav-item" data-target="enroll-student-tab">
                    <i class="ri-user-add-line"></i> Enroll Student
                </button>
                <button class="nav-item" data-target="mark-attendance-tab">
                    <i class="ri-camera-lens-line"></i> Mark Attendance
                </button>
                <button class="nav-item" data-target="reports-tab">
                    <i class="ri-file-chart-line"></i> Reports
                </button>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn sidebar-logout"><i class="ri-logout-box-r-line"></i> Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="dashboard-header" style="margin-bottom: 30px;">
                <h2 id="welcome-msg">Welcome, TEACHER</h2>
            </div>
            <div class="dashboard-content" style="margin-top: 0;">
                
                <!-- My Courses Tab -->
                <div id="my-courses-tab" class="tab-content active">
                    <div class="card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <h4 style="margin: 0;">Your Allocated Courses</h4>
                            <button class="secondary-btn" style="padding: 8px 12px; font-size: 0.9rem;">
                                📊 View All Classes Report
                            </button>
                        </div>
                        <p class="hint">Click on a course to manage attendance</p>
                        <div id="teacher-course-list" class="course-list-container"></div>
                    </div>
                </div>

                <!-- Enroll Student Tab -->
                <div id="enroll-student-tab" class="tab-content">
                    <div class="card" style="border-left: 5px solid #3498db;">
                        <h4>Enroll Student</h4>
                        <div class="input-group">
                            <select id="enroll-course-select">
                                <option value="" disabled selected>Select Course</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <select id="enroll-student-select">
                                <option value="" disabled selected>Select Student</option>
                            </select>
                        </div>
                        <div class="camera-box">
                            <p>Facial Registration:</p>
                            <video id="enroll-video" class="hidden" autoplay playsinline></video>
                            <div class="camera-controls">
                                <button id="btn-start-enroll-cam" class="secondary-btn">Open Camera</button>
                                <button id="btn-capture-enroll-face" class="secondary-btn hidden">Capture Face</button>
                            </div>
                            <p id="enroll-face-status" style="color:red; font-size:0.9em;">* Face Scan Required</p>
                        </div>
                        <button class="action-btn">Complete Enrollment</button>
                    </div>
                </div>

                <!-- Mark Attendance Tab -->
                <div id="mark-attendance-tab" class="tab-content">
                    <div class="card" style="border-left: 5px solid #e74c3c; margin-bottom: 20px;">
                        <h4>Facial Scan Attendance</h4>
                        <p class="hint">Auto-mark attendance via camera.</p>
                        <video id="camera-stream" autoplay playsinline></video>
                        <button class="action-btn" style="background: linear-gradient(135deg, #e74c3c, #c0392b);">SCAN FACE</button>
                        <p id="scan-result" style="margin-top: 10px; min-height: 20px;"></p>
                    </div>

                    <div class="card" style="border-left: 5px solid #f39c12;">
                        <h4>Manual Override</h4>
                        <p class="hint">Mark students as Present or Absent.</p>
                        <div id="manual-student-list" class="manual-list-scroll"></div>
                        <button class="action-btn">Save Manual Attendance</button>
                    </div>
                </div>

                <!-- Reports Tab -->
                <div id="reports-tab" class="tab-content">
                    <div class="card">
                        <h4>Reports</h4>
                        <div class="input-group" style="align-items: center;">
                            <label style="color: var(--white-soft); margin-right: 10px;">Daily Sheet Date:</label>
                            <input type="date" id="report-date-picker">
                            <button class="action-btn">View Daily Sheet</button>
                        </div>
                        <hr style="margin: 15px 0; border: 0; border-top: 1px solid rgba(255, 255, 255, 0.15);">
                        <button class="action-btn">View Detailed Course Report</button>
                        <div id="teacher-report-area" style="overflow-x:auto; margin-top: 15px;"></div>
                    </div>
                </div>

            </div>
        </main>
    </div>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/teacher.js"></script>
</body>

</html>
