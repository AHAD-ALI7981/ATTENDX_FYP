<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="AttendX — Set your new account password">

   <!--=============== REMIXICONS ===============-->
   <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">

   <!--=============== CSS ===============-->
   <link rel="stylesheet" href="assets/css/styles.css">

   <title>AttendX — Reset Password</title>
</head>

<body>
   <div class="login">
      <img src="assets/img/login-bg.png" alt="login image" class="login__img">

      <form id="reset-password-form" class="login__form">
         <div class="login__brand">
            <div class="login__brand-icon">
               <i class="ri-graduation-cap-fill"></i>
            </div>
         </div>
         <h1 class="login__title">Reset Password</h1>
         <p class="login__subtitle">Enter your new password below</p>

         <div class="login__content">
            <div class="login__box">
               <i class="ri-lock-2-line login__icon"></i>

               <div class="login__box-input">
                  <input type="password" required class="login__input" id="new-password" placeholder=" ">
                  <label for="new-password" class="login__label">New Password</label>
                  <i class="ri-eye-off-line login__eye" id="new-password-eye"></i>
               </div>
            </div>

            <div class="login__box">
               <i class="ri-lock-2-line login__icon"></i>

               <div class="login__box-input">
                  <input type="password" required class="login__input" id="confirm-password" placeholder=" ">
                  <label for="confirm-password" class="login__label">Confirm Password</label>
                  <i class="ri-eye-off-line login__eye" id="confirm-password-eye"></i>
               </div>
            </div>
         </div>

         <div id="reset-message" style="display: none; margin-bottom: 1rem; text-align: center; font-size: 0.9rem; padding: 10px; border-radius: 5px;">
         </div>

         <button type="submit" class="login__button" id="reset-btn">Reset Password</button>

      </form>
   </div>

   <script src="assets/js/forgot-password.js"></script>
</body>

</html>
