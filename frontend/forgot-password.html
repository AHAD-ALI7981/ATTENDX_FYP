<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="AttendX — Reset your account password">

   <!--=============== REMIXICONS ===============-->
   <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">

   <!--=============== CSS ===============-->
   <link rel="stylesheet" href="assets/css/styles.css">

   <title>AttendX — Forgot Password</title>
</head>

<body>
   <div class="login">
      <img src="assets/img/bg-ember.png" alt="login image" class="login__img">

      <form id="forgot-password-form" class="login__form">
         <div class="login__brand">
            <div class="login__brand-icon">
               <i class="ri-fingerprint-line"></i>
            </div>
         </div>
         <h1 class="login__title">Forgot Password</h1>
         <p class="login__subtitle">Enter your email to receive a reset link</p>

         <div class="login__content">
            <div class="login__box">
               <i class="ri-mail-line login__icon"></i>

               <div class="login__box-input">
                  <input type="email" required class="login__input" id="forgot-email" placeholder=" ">
                  <label for="forgot-email" class="login__label">Email Address</label>
               </div>
            </div>
         </div>

         <div id="forgot-message" style="display: none; margin-bottom: 1rem; text-align: center; font-size: 0.9rem; padding: 10px; border-radius: 5px;">
         </div>

         <div>
            <a href="login.html" class="login__forgot" style="text-align: center; display: block; margin-bottom: 1rem;">Back to Login</a>
         </div>

         <button type="submit" class="login__button" id="forgot-btn">Send Reset Link</button>

      </form>
   </div>

   <script src="assets/js/forgot-password.js"></script>
</body>

</html>
