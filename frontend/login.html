<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="AttendX — AI-Powered Face Recognition Attendance System for Educational Institutions">

   <!--=============== REMIXICONS ===============-->
   <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">

   <!--=============== CSS ===============-->
   <link rel="stylesheet" href="assets/css/styles.css">

   <title>AttendX — Login</title>
</head>

<body>
   <div class="login">
      <img src="assets/img/login-bg.png" alt="login image" class="login__img">

      <form action="" class="login__form">
         <div class="login__brand">
            <div class="login__brand-icon">
               <i class="ri-graduation-cap-fill"></i>
            </div>
         </div>
         <h1 class="login__title">AttendX</h1>
         <p class="login__subtitle">AI-Powered Attendance System</p>

         <div class="login__content">
            <div class="login__box">
               <i class="ri-user-3-line login__icon"></i>

               <div class="login__box-input">
                  <input type="text" required class="login__input" id="login-username" placeholder=" ">
                  <label for="login-username" class="login__label">Username</label>
               </div>
            </div>

            <div class="login__box">
               <i class="ri-lock-2-line login__icon"></i>

               <div class="login__box-input">
                  <input type="password" required class="login__input" id="login-pass" placeholder=" ">
                  <label for="login-pass" class="login__label">Password</label>
                  <i class="ri-eye-off-line login__eye" id="login-eye"></i>
               </div>
            </div>
         </div>

         <div>
            <a href="forgot-password.html" class="login__forgot">Forgot Password?</a>
         </div>

         <button type="submit" class="login__button">Login</button>

      </form>
   </div>

   <script src="assets/js/auth.js"></script>
</body>

</html>
